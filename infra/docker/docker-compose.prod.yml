name: pssms-prod

# HIGHLINK PSSMS — Production stack (Caddy TLS).
# Public entrypoints:
#   https://web.hisgc.co.tz         -> admin-web
#   https://api.hisgc.co.tz         -> core-api
#   https://customer.hisgc.co.tz    -> customer-web
#   https://executive.hisgc.co.tz   -> executive-web
#   https://supplier.hisgc.co.tz    -> supplier-web
#   https://recruitment.hisgc.co.tz -> recruitment-web
#   https://visitor.hisgc.co.tz     -> visitor-web
#   https://parking.hisgc.co.tz     -> parking-web
#   https://files.hisgc.co.tz       -> MinIO
#
# Bring up:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# NOTE: Omits Keycloak, RabbitMQ, MQTT, Python AI so it fits a small VPS.
# core-api runs AUTH_MODE=local (break-glass POST /auth/login).
# Point each subdomain DNS (A/AAAA or Cloudflare) at this host before first TLS.

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
  AUTH_MODE: ${AUTH_MODE:-local}
  INTEGRATION_SERVICE_TOKEN: ${INTEGRATION_SERVICE_TOKEN}
  CORE_API_INTERNAL_URL: http://core-api:4001
  SMS_PROVIDER: console
  PAYMENT_PROVIDER: console
  WEBHOOK_VERIFY: "false"
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  # In-cluster S3 is plain HTTP; browser presigns use public host/TLS.
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-files.hisgc.co.tz}
  MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-443}
  MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-true}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pssms}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pssms_minio_password}
  MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-pssms-documents}

x-frontend-env: &frontend-env
  HOSTNAME: "0.0.0.0"
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    container_name: pssms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pssms-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pssms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pssms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pssms_minio_password}
    volumes:
      - minio_data:/data

  db-migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: build
    image: pssms-backend-build:prod
    container_name: pssms-db-migrate
    restart: "no"
    environment:
      <<: *backend-env
    # Fresh-DB safe order: schemas -> tables (db push) -> RLS files -> seed -> grants.
    command: >
      sh -c "
        npx prisma db execute --file prisma/migrations/0000_schemas/migration.sql --schema prisma/schema.prisma &&
        npx prisma db push --schema prisma/schema.prisma &&
        npx prisma db execute --file prisma/migrations/0001_reporting_rls/migration.sql --schema prisma/schema.prisma &&
        npm run prisma:seed &&
        npx prisma db execute --file prisma/migrations/0003_rls_core/migration.sql --schema prisma/schema.prisma &&
        npx prisma db execute --file prisma/migrations/0004_devices/migration.sql --schema prisma/schema.prisma &&
        npx prisma db execute --file prisma/migrations/0005_asset_return_confirm/migration.sql --schema prisma/schema.prisma &&
        npx prisma db execute --file prisma/migrations/0006_compliance/migration.sql --schema prisma/schema.prisma &&
        npx prisma db execute --file prisma/migrations/0007_documents/migration.sql --schema prisma/schema.prisma
      "
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: pssms-core-api:prod
    container_name: pssms-core-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORE_API_PORT: "4001"
      # Runs as the NON-OWNER app role so PostgreSQL RLS policies apply to every query.
      DATABASE_URL: postgresql://pssms_app:${PSSMS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "dist/apps/core-api/main.js"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  admin-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: admin-web
        APP_PORT: "3000"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
        NEXT_PUBLIC_REPORTING_API_URL: https://api.hisgc.co.tz
        NEXT_PUBLIC_OIDC_REDIRECT_URI: https://web.hisgc.co.tz/auth/callback
    image: pssms-admin-web:prod
    container_name: pssms-admin-web
    restart: unless-stopped
    environment:
      <<: *frontend-env
      PORT: "3000"
    depends_on:
      core-api:
        condition: service_started

  customer-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: customer-web
        APP_PORT: "3002"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
        NEXT_PUBLIC_REPORTING_API_URL: https://api.hisgc.co.tz
    image: pssms-customer-web:prod
    container_name: pssms-customer-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3002"
    depends_on:
      core-api:
        condition: service_started

  executive-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: executive-web
        APP_PORT: "3001"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
        NEXT_PUBLIC_REPORTING_API_URL: https://api.hisgc.co.tz
    image: pssms-executive-web:prod
    container_name: pssms-executive-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3001"
    depends_on:
      core-api:
        condition: service_started

  supplier-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: supplier-web
        APP_PORT: "3003"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
    image: pssms-supplier-web:prod
    container_name: pssms-supplier-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3003"
    depends_on:
      core-api:
        condition: service_started

  recruitment-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: recruitment-web
        APP_PORT: "3004"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
    image: pssms-recruitment-web:prod
    container_name: pssms-recruitment-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3004"
    depends_on:
      core-api:
        condition: service_started

  visitor-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: visitor-web
        APP_PORT: "3005"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
    image: pssms-visitor-web:prod
    container_name: pssms-visitor-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3005"
    depends_on:
      core-api:
        condition: service_started

  parking-web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: parking-web
        APP_PORT: "3006"
        NEXT_PUBLIC_CORE_API_URL: https://api.hisgc.co.tz
    image: pssms-parking-web:prod
    container_name: pssms-parking-web
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *frontend-env
      PORT: "3006"
    depends_on:
      core-api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: pssms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core-api
      - admin-web
      - customer-web
      - executive-web
      - supplier-web
      - recruitment-web
      - visitor-web
      - parking-web
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
